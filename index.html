<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giphy Search Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <ul class="menu">
            <li><a href="#" id="home-link">Home</a></li>
            <li><a href="#" id="trending-link">Trending</a></li>
            <li><a href="#" id="favorites-link">Favorites</a></li>
            <li><a href="#" id="about-link">About</a></li>
        </ul>
    </nav>
    <!-- Header -->
    <header>
        <h1>Giphy Search Engine</h1>
        <h3>Find images with the Giphy API</h3>
    </header>
    <!-- Search Section -->
    <section class="search-section">
        <form id="search-form">
            <input
                type="text"
                id="search-input"
                placeholder="Enter search here..."
                required
            >
            <button type="submit">
                Search
            </button>
        </form>
    </section>
    <!-- Loading Spinner -->
    <div id="loader" class="hidden">
    <div class="spinner"></div>
    <p>Loading GIFs...</p>
    </div>
    <!-- Error Message -->
     <p id="error-message"></p>
    <!-- Main Content Area -->
    <main id="gif-container">
    </main>
    <!-- Modal -->
    <div id="modal" class="hidden">
    <span id="close-modal">&times;</span>
    <img id="modal-image">
    </div>
    <button id="back-to-top" class="hidden">
    ↑ Back to Top
    </button>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
<footer>
    © 2026 Giphy Search Engine
</footer>
</body>
</html>
